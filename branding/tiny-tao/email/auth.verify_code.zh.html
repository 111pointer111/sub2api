<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{site_name}} 邮箱验证码</title>
</head>
<body style="margin:0;padding:24px 16px;background:#ffffff;color:#202124;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:16px;line-height:1.7;">
  <main style="max-width:560px;margin:0 auto;">
    <p style="margin:0 0 24px;font-size:14px;">{{site_name}}</p>
    <h1 style="margin:0 0 24px;font-size:22px;font-weight:600;">验证你的邮箱</h1>
    <p>你好，</p>
    <p>我们收到了你在 {{site_name}} 发起的邮箱验证请求。请在原页面输入以下验证码：</p>
    <p style="margin:24px 0;font-family:Consolas,monospace;font-size:32px;font-weight:700;">{{verification_code}}</p>
    <p>验证码有效期为 {{expires_in_minutes}} 分钟，请勿向他人透露。</p>
    <p>如果不是你发起的请求，请忽略这封邮件，无需回复。</p>
    <p style="margin:32px 0 0;padding-top:16px;border-top:1px solid #dadce0;font-size:13px;color:#5f6368;">{{site_name}}<br><a href="https://api.stao-ai.com/" style="color:#1a73e8;">api.stao-ai.com</a><br>此邮件由系统自动发送。</p>
  </main>
</body>
</html>
